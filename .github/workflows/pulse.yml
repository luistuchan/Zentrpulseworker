name: ZENTR Pulse Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pulse.yml'
      - 'worker.py'
      - 'clipper.py'
      - 'tests/test_clipper_render_smoke.py'
  workflow_dispatch:
    inputs:
      retry_job:
        description: 'Optional: exact held job ID to retry after correcting queue.json'
        required: false
        type: string
  schedule:
    - cron: '0 1,9,17 * * *'

# Never run this secret-bearing workflow on pull_request or untrusted code.
permissions:
  contents: write

concurrency:
  group: zentr-pulse-production
  # Supersede the stalled pre-fix run for this recovery deployment only.
  cancel-in-progress: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Replace stalled Pulse setup run' }}

jobs:
  process-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check FFmpeg and fonts
        timeout-minutes: 5
        run: |
          if ! command -v ffprobe >/dev/null || ! ffmpeg -hide_banner -h filter=subtitles 2>/dev/null | grep -F 'Render text subtitles' >/dev/null || ! fc-list : family | grep -F 'DejaVu Sans' >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update -qq
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y ffmpeg fonts-dejavu-core
          fi
          ffprobe -version | sed -n '1p'
      - name: Install Python media dependencies
        timeout-minutes: 5
        run: python -m pip install --timeout 20 --retries 2 -r requirements.txt
      - name: Test worker before using credentials
        run: python -m unittest discover -s tests -v
      - name: Restore authoritative queue state
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin pulse-state >/dev/null 2>&1; then
            git fetch origin pulse-state --depth=1
            git show FETCH_HEAD:queue.json > state/queue.json
          fi
      - name: Restore resumable media stages
        uses: actions/cache/restore@v4
        with:
          path: .work
          key: pulse-media-v3-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pulse-media-v3-
      - name: Check configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREE_TIER_CONFIRMED: ${{ vars.FREE_TIER_CONFIRMED || '0' }}
        run: python worker.py --doctor
      - name: Produce video drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREE_TIER_CONFIRMED: ${{ vars.FREE_TIER_CONFIRMED || '0' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-AriaNeural' }}
          ZENTR_VISUAL_QUALITY_GATE: '1'
          TARGET_SECONDS: ${{ vars.TARGET_SECONDS || '30' }}
          MAX_JOBS_PER_RUN: '3'
          MAX_AI_CALLS: '96'
          MAX_AI_CALLS_PER_RUN: '32'
          MAX_CANDIDATES_PER_RUN: '9'
          MAX_YOUTUBE_SEARCHES: '18'
          MAX_PEXELS_SEARCHES: '96'
          MAX_PIXABAY_SEARCHES: '72'
          RETRY_JOB: ${{ inputs.retry_job }}
        run: python worker.py --discover --retry "$RETRY_JOB"
      - name: Send playable MP4 through Telegram review bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
        if: ${{ !cancelled() }}
        run: |
          if ! compgen -G 'output/*/review.json' > /dev/null; then
            echo 'No finished drafts to deliver.'
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          try:
              token = os.environ['TELEGRAM_BOT_TOKEN']
              with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=15) as response:
                  bot = json.load(response)['result']
          except Exception:
              raise SystemExit('Could not verify the configured Telegram bot.')
          names = [re.sub(r'[^a-z0-9]', '', bot.get(key, '').lower()) for key in ('first_name', 'username')]
          if not any('zentrdisplay' in name for name in names):
              raise SystemExit('Configured Telegram bot does not identify itself as ZENTR Display.')
          PY
          python telegram_delivery.py
      - name: Save authoritative queue state
        if: always()
        run: |
          if [ ! -s state/queue.json ]; then exit 0; fi
          if git ls-remote --exit-code --heads origin pulse-state >/dev/null 2>&1; then
            git fetch origin pulse-state --depth=1
            git worktree add --detach .state-persist FETCH_HEAD
          else
            git worktree add --detach .state-persist HEAD
            git -C .state-persist checkout --orphan pulse-state
            git -C .state-persist rm -rf .
          fi
          cp state/queue.json .state-persist/queue.json
          git -C .state-persist config user.name 'ZENTR Pulse Worker'
          git -C .state-persist config user.email 'pulse-worker@users.noreply.github.com'
          git -C .state-persist add queue.json
          if ! git -C .state-persist diff --cached --quiet; then
            git -C .state-persist commit -m 'Checkpoint Pulse production queue'
            git -C .state-persist push origin HEAD:refs/heads/pulse-state
          fi
      - name: Save resumable media stages
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .work
          key: pulse-media-v3-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Show production status
        if: always()
        run: |
          if [ -f output/status.md ]; then
            cat output/status.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Worker did not produce a status report. Inspect the failing step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save review-ready outputs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-review-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
      - name: Save recovery queue snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-state-${{ github.run_number }}
          path: state/queue.json
          if-no-files-found: ignore
          retention-days: 30


