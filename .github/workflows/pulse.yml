
name: ZENTR Pulse Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9,15,21 * * *'

permissions:
  contents: read

jobs:
  process-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Run ZENTR Pulse worker
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_AI: ${{ vars.ENABLE_AI || '0' }}
        run: python worker.py

      - name: Display ZENTR Viral Radar
        if: always()
        run: |
          if [ -f output/research/viral_radar.md ]; then
            cat output/research/viral_radar.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No research report generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save viral research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zentr-pulse-viral-radar
          path: output/research/
          if-no-files-found: warn
          retention-days: 30

      - name: Save processed videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zentr-pulse-videos
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 7
