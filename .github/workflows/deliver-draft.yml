name: Send Existing Pulse Draft to Telegram

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deliver-draft.yml'
  workflow_dispatch:

# Never run this secret-bearing workflow on pull_request or untrusted code.
permissions:
  contents: write
  actions: read

concurrency:
  group: zentr-pulse-production
  cancel-in-progress: false

jobs:
  process-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore authoritative queue state
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin pulse-state >/dev/null 2>&1; then
            git fetch origin pulse-state --depth=1
            git show FETCH_HEAD:queue.json > state/queue.json
          fi
      - name: Retrieve and verify the APEC draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/5eca2e638c3e1e33
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/14572024711/zip" > "$RUNNER_TEMP/pulse-review.zip"
          for file in video.mp4 review.json; do
            unzip -p "$RUNNER_TEMP/pulse-review.zip" "5eca2e638c3e1e33/$file" > "output/5eca2e638c3e1e33/$file"
          done
          echo '895d4499aa27dc2297fb804be1f785bb3e76c841648f3f5690c36b72876576d3  output/5eca2e638c3e1e33/video.mp4' | sha256sum -c -
      - name: Send playable MP4 through Telegram review bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          try:
              token = os.environ['TELEGRAM_BOT_TOKEN']
              with urllib.request.urlopen(f'https://api.telegram.org/bot{token}/getMe', timeout=15) as response:
                  bot = json.load(response)['result']
          except Exception:
              raise SystemExit('Could not verify the configured Telegram bot.')
          names = [re.sub(r'[^a-z0-9]', '', bot.get(key, '').lower()) for key in ('first_name', 'username')]
          if not any('zentrdisplay' in name for name in names):
              raise SystemExit('Configured Telegram bot does not identify itself as ZENTR Display.')
          PY
          python telegram_delivery.py
      - name: Save authoritative queue state
        if: always()
        run: |
          if [ ! -s state/queue.json ]; then exit 0; fi
          if git ls-remote --exit-code --heads origin pulse-state >/dev/null 2>&1; then
            git fetch origin pulse-state --depth=1
            git worktree add --detach .state-persist FETCH_HEAD
          else
            git worktree add --detach .state-persist HEAD
            git -C .state-persist checkout --orphan pulse-state
            git -C .state-persist rm -rf .
          fi
          cp state/queue.json .state-persist/queue.json
          git -C .state-persist config user.name 'ZENTR Pulse Worker'
          git -C .state-persist config user.email 'pulse-worker@users.noreply.github.com'
          git -C .state-persist add queue.json
          if ! git -C .state-persist diff --cached --quiet; then
            git -C .state-persist commit -m 'Checkpoint Pulse production queue'
            git -C .state-persist push origin HEAD:refs/heads/pulse-state
          fi
      - name: Save review-ready outputs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-delivery-report-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
      - name: Save recovery queue snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-delivery-state-${{ github.run_number }}
          path: state/queue.json
          if-no-files-found: ignore
          retention-days: 30


